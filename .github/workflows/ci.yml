name: CI - Trigger Jenkins

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:
    inputs:
      jenkins_job:
        description: "Override Jenkins job name"
        required: false

jobs:
  trigger-jenkins:
    name: Trigger Jenkins Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # env:
    #   JENKINS_URL: ${{ secrets.JENKINS_URL }}
    #   JENKINS_USER: ${{ secrets.JENKINS_USER }}
    #   JENKINS_TOKEN: ${{ secrets.JENKINS_TOKEN }}
    #   JENKINS_JOB: ${{ github.event.inputs.jenkins_job || secrets.JENKINS_JOB }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Jenkins secrets
        run: |
          set -euo pipefail
          missing=0
          for v in JENKINS_URL JENKINS_USER JENKINS_TOKEN JENKINS_JOB; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Missing required secret/env: $v"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: Fetch CSRF crumb
        id: crumb
        run: |
          set -euo pipefail
          CRUMB_JSON=$(curl -sS --fail \
            -u "${JENKINS_USER}:${JENKINS_TOKEN}" \
            "${JENKINS_URL%/}/crumbIssuer/api/json" || echo "")

          if [ -n "$CRUMB_JSON" ] && echo "$CRUMB_JSON" | jq -e .crumb >/dev/null 2>&1; then
            FIELD=$(echo "$CRUMB_JSON" | jq -r .crumbRequestField)
            VALUE=$(echo "$CRUMB_JSON" | jq -r .crumb)
            echo "header=${FIELD}: ${VALUE}" >> "$GITHUB_OUTPUT"
            echo "Crumb acquired (${FIELD})"
          else
            echo "header=" >> "$GITHUB_OUTPUT"
            echo "No CSRF crumb required (or crumb issuer disabled)."
          fi

      - name: Trigger Jenkins job
        id: trigger
        run: |
          set -euo pipefail
          ENC_JOB=$(echo -n "${JENKINS_JOB}" | jq -sRr @uri)
          URL="${JENKINS_URL%/}/job/${ENC_JOB}/buildWithParameters"

          ARGS=(-sS -i -o response.txt -w "%{http_code}"
                -u "${JENKINS_USER}:${JENKINS_TOKEN}"
                -X POST
                --data-urlencode "GIT_BRANCH=${GITHUB_REF_NAME}"
                --data-urlencode "GIT_COMMIT=${GITHUB_SHA}"
                --data-urlencode "GITHUB_REPO=${GITHUB_REPOSITORY}"
                --data-urlencode "TRIGGERED_BY=${GITHUB_ACTOR}")

          if [ -n "${{ steps.crumb.outputs.header }}" ]; then
            ARGS+=(-H "${{ steps.crumb.outputs.header }}")
          fi

          HTTP=$(curl "${ARGS[@]}" "$URL")
          echo "HTTP $HTTP"
          cat response.txt

          if [ "$HTTP" != "201" ] && [ "$HTTP" != "200" ]; then
            echo "::error::Jenkins refused the trigger (HTTP $HTTP)"
            exit 1
          fi

          QUEUE_URL=$(grep -i '^location:' response.txt | awk '{print $2}' | tr -d '\r\n')
          if [ -z "$QUEUE_URL" ]; then
            echo "::error::No queue Location header returned by Jenkins"
            exit 1
          fi
          echo "Queue item: $QUEUE_URL"
          echo "queue_url=$QUEUE_URL" >> "$GITHUB_OUTPUT"

      - name: Wait for build to start
        id: build_url
        run: |
          set -euo pipefail
          QUEUE_URL="${{ steps.trigger.outputs.queue_url }}"
          for i in $(seq 1 60); do
            JSON=$(curl -sS --fail -u "${JENKINS_USER}:${JENKINS_TOKEN}" "${QUEUE_URL%/}/api/json" || true)
            EXE_URL=$(echo "$JSON" | jq -r '.executable.url // empty')
            if [ -n "$EXE_URL" ]; then
              echo "Build started: $EXE_URL"
              echo "url=$EXE_URL" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            CANCELLED=$(echo "$JSON" | jq -r '.cancelled // false')
            if [ "$CANCELLED" = "true" ]; then
              echo "::error::Queue item was cancelled before starting"
              exit 1
            fi
            echo "Waiting for build to leave the queue... (${i}/60)"
            sleep 5
          done
          echo "::error::Timed out waiting for Jenkins build to start"
          exit 1

      - name: Wait for build to finish
        id: result
        run: |
          set -euo pipefail
          BUILD_URL="${{ steps.build_url.outputs.url }}"
          for i in $(seq 1 180); do
            JSON=$(curl -sS --fail -u "${JENKINS_USER}:${JENKINS_TOKEN}" "${BUILD_URL%/}/api/json" || true)
            RESULT=$(echo "$JSON" | jq -r '.result // empty')
            BUILDING=$(echo "$JSON" | jq -r '.building // true')
            if [ -n "$RESULT" ] && [ "$BUILDING" != "true" ]; then
              echo "Result: $RESULT"
              echo "result=$RESULT" >> "$GITHUB_OUTPUT"
              echo "build_url=$BUILD_URL" >> "$GITHUB_OUTPUT"
              break
            fi
            echo "Build in progress... (${i}/180)"
            sleep 10
          done

          if [ -z "${RESULT:-}" ]; then
            echo "::error::Timed out waiting for Jenkins build to finish"
            exit 1
          fi

          case "$RESULT" in
            SUCCESS)  echo "::notice::Jenkins build succeeded — $BUILD_URL"; exit 0 ;;
            UNSTABLE) echo "::warning::Jenkins build was UNSTABLE — $BUILD_URL"; exit 1 ;;
            FAILURE)  echo "::error::Jenkins build FAILED — $BUILD_URL"; exit 1 ;;
            ABORTED)  echo "::error::Jenkins build was ABORTED — $BUILD_URL"; exit 1 ;;
            *)        echo "::error::Unknown Jenkins result: $RESULT"; exit 1 ;;
          esac

      - name: Summarize
        if: always()
        run: |
          {
            echo "### Jenkins build"
            echo ""
            echo "- Job: \`${JENKINS_JOB}\`"
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Build URL: ${{ steps.result.outputs.build_url || steps.build_url.outputs.url || 'n/a' }}"
            echo "- Result: ${{ steps.result.outputs.result || 'n/a' }}"
          } >> "$GITHUB_STEP_SUMMARY"
